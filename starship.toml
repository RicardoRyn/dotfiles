format = """
[╭─](bold green) $os\
$conda\
$directory\
${jj_bookmark}\
${jj_change}\
${jj_metrics}\
${jj_status}\
${git_branch}\
${git_state}\
${git_metrics}\
${git_status}\
$python\
$rust\
$lua\
$fill\
$cmd_duration\
$time\
$line_break\
[╰─](bold green)$character
"""

add_newline = true
palette = "catppuccin_latte"
command_timeout = 2000
scan_timeout = 2000

[os]
disabled = false
style = 'green'

[os.symbols]
Windows = " "
Ubuntu = "󰕈 "
Arch = "󰣇 "

[conda]
symbol = " "
format = "[$symbol$environment]($style) "
style = 'bold green'

[directory]
style = 'bold sky'
format = '[$path ]($style)'
truncation_length = 5
truncation_symbol = '…/'
truncate_to_repo = false

[directory.substitutions]
'Documents' = '󰈙'
'Downloads' = ' '
'Music' = ' '
'Pictures' = ' '

[vcs]
order = ["jj", "git"]

[jj_bookmark]
symbol = ' '
diverged_symbol = "⇕"

[jj_change]
format = "($change) "

[jj_metrics]
format = '[+$added]($added_style)/[-$deleted]($deleted_style) '

[jj_status]
style = "yellow"
added = "+$count"
copied = "=$count"
deleted = "✘$count"
modified = "~$count"
renamed = "»$count"

[git_branch]
disabled = true
symbol = ' '

[git_state]
disabled = true
format = '[\($state( $progress_current of $progress_total)\)]($style) '
cherry_pick = '[🍒 PICKING](bold red)'

[git_metrics]
disabled = true
added_style = 'bold blue'
format = '[+$added]($added_style)/[-$deleted]($deleted_style) '

[git_status]
disabled = true
format = '([$all_status$ahead_behind]($style) )'
style = 'red'

[python]
symbol = ' '
style = 'lavender'

[rust]
symbol = ' '
style = 'maroon'

[lua]
symbol = ' '
style = 'blue'

[fill]
symbol = ' '

[cmd_duration]
format = 'took [$duration](overlay0) '
style = 'overlay0'
min_time = 60000

[time]
disabled = false
time_format = "%T"
style = "overlay0"
format = '  [$time ]($style)'


[character]
success_symbol = '[](bold green)'
error_symbol = '[!](bold red)'

[palettes.catppuccin_latte]
rosewater = "#dc8a78"
flamingo = "#dd7878"
pink = "#ea76cb"
mauve = "#8839ef"
red = "#d20f39"
maroon = "#e64553"
peach = "#fe640b"
yellow = "#df8e1d"
green = "#40a02b"
teal = "#179299"
sky = "#04a5e5"
sapphire = "#209fb5"
blue = "#1e66f5"
lavender = "#7287fd"
text = "#4c4f69"
subtext1 = "#5c5f77"
subtext0 = "#6c6f85"
overlay2 = "#7c7f93"
overlay1 = "#8c8fa1"
overlay0 = "#9ca0b0"
surface2 = "#acb0be"
surface1 = "#bcc0cc"
surface0 = "#ccd0da"
base = "#eff1f5"
mantle = "#e6e9ef"
crust = "#dce0e8"
