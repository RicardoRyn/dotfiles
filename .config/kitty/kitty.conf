# 主题
# include dank-theme.conf
include catppuccin-latte.conf

# 风格
hide_window_decorations titlebar-only
background_opacity 1
# background_blur 30
window_padding_width 2
remember_window_size yes

tab_bar_edge top
tab_bar_style powerline
tab_powerline_sytle slanted

macos_option_as_alt yes

# 终端功能
scrollback_lines 9999
copy_on_select yes
strip_trailing_spaces smart

map alt+1 combine : send_key ctrl+space : send_key 1
map alt+2 combine : send_key ctrl+space : send_key 2
map alt+3 combine : send_key ctrl+space : send_key 3
map alt+4 combine : send_key ctrl+space : send_key 4
map alt+5 combine : send_key ctrl+space : send_key 5
map alt+6 combine : send_key ctrl+space : send_key 6
map alt+7 combine : send_key ctrl+space : send_key 7
map alt+8 combine : send_key ctrl+space : send_key 8
map alt+9 combine : send_key ctrl+space : send_key 9

# 字体
font_family      family="Maple Mono NF CN"
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size 11
map ctrl+plus change_font_size all +1.0
map ctrl+minus change_font_size all -1.0
map ctrl+0 change_font_size all 0

# 光标
cursor_trail 3
cursor_trail_decay 0.1 0.2
cursor_trail_start_threshold 2


# 连接neovim
allow_remote_control socket-only
listen_on unix:/tmp/kitty
shell_integration enabled
# kitty-scrollback.nvim Kitten alias
action_alias kitty_scrollback_nvim kitten $HOME/.local/share/nvim/site/pack/core/opt/kitty-scrollback.nvim/python/kitty_scrollback_nvim.py
# Browse scrollback buffer in nvim
map kitty_mod+h kitty_scrollback_nvim
# # Browse output of the last shell command in nvim
# map kitty_mod+g kitty_scrollback_nvim --config ksb_builtin_last_cmd_output
# Show clicked command output in nvim
mouse_map ctrl+shift+right press ungrabbed combine : mouse_select_command_output : kitty_scrollback_nvim --config ksb_builtin_last_visited_cmd_output
