[keys]
"Alt + Z" = "toggle_space_activated"
"Alt + Shift + R" = { exec = ["rift-cli", "execute", "config", "reload"] }
"Alt + R" = { binding_mode = "R" }
"Alt + Y"= { exec = ["rift-cli", "execute", "window", "resize-by", "--amount=-0.1"] }
"Alt + O"= { exec = ["rift-cli", "execute", "window", "resize-by", "--amount=0.1"] }
"Alt + F"= { exec = ["rift-cli", "execute", "layout", "switch-preset-column-width"] }
"Alt + Shift + F" = "toggle_fullscreen_within_gaps"
"Alt + Shift + Space" = "toggle_window_floating"
"Alt + H" = { move_focus = "left" }
"Alt + J" = { move_focus = "down" }
"Alt + K" = { move_focus = "up" }
"Alt + L" = { move_focus = "right" }
"Alt + Shift + H" = { move_node = "left" }
"Alt + Shift + J" = { move_node = "down" }
"Alt + Shift + K" = { move_node = "up" }
"Alt + Shift + L" = { move_node = "right" }
"Alt + 1" = { switch_to_workspace = 0 }
"Alt + 2" = { switch_to_workspace = 1 }
"Alt + 3" = { switch_to_workspace = 2 }
"Alt + 4" = { switch_to_workspace = 3 }
"Alt + 5" = { switch_to_workspace = 4 }
"Alt + 6" = { switch_to_workspace = 5 }
"Alt + 7" = { switch_to_workspace = 6 }
"Alt + 8" = { switch_to_workspace = 7 }
"Alt + 9" = { switch_to_workspace = 8 }
"Alt + Shift + 1" = { move_window_to_workspace = 0 }
"Alt + Shift + 2" = { move_window_to_workspace = 1 }
"Alt + Shift + 3" = { move_window_to_workspace = 2 }
"Alt + Shift + 4" = { move_window_to_workspace = 3 }
"Alt + Shift + 5" = { move_window_to_workspace = 4 }
"Alt + Shift + 6" = { move_window_to_workspace = 5 }
"Alt + Shift + 7" = { move_window_to_workspace = 6 }
"Alt + Shift + 8" = { move_window_to_workspace = 7 }
"Alt + Shift + 9" = { move_window_to_workspace = 8 }

[binding_modes.R]
"H" = { resize_window_shrink = "horizontal" }
"L" = { resize_window_grow = "horizontal" }
"Escape" = { binding_mode = "default" }

[settings]
default_disable = false
focus_follows_mouse = false
animate = true
animation_duration = 0.1

[settings.drag_drop]
enabled = true
drop_action = "stack"

[settings.gestures]
enabled = true
fingers = 5
skip_empty = true

[settings.layout]
mode = "scrolling"

[settings.layout.scrolling]
column_width_ratio = 0.7
preserve_window_sizes = true
expand_single_column = false
min_column_width_ratio = 0.3
max_column_width_ratio = 1.0
alignment = "center"
focus_navigation_style = "niri"
preset_column_widths = [0.5, 0.7, 1.0]

[settings.layout.scrolling.gestures]
enabled = true
invert_horizontal = true
fingers = 4

[settings.layout.stack]
stack_offset = 0.0
default_orientation = "perpendicular"

[settings.layout.gaps.outer]
top = 0.0
left = 0.0
bottom = 0.0
right = 0.0

[settings.layout.gaps.inner]
horizontal = 2.0
vertical = 2.0

[settings.ui.menu_bar]
enabled = true
display_style = "label"
active_label = "name"
show_fullscreen_indicator = true
show_empty = false
mode = "all"
current_display_only = false

[settings.ui.stack_line]
enabled = true
hover = "hover"
horiz_placement = "bottom"
vert_placement = "right"
thickness = 25
spacing = 2

[settings.ui.mission_control]
enabled = true
activate_on_hotkey_release = false
show_empty_workspaces = true
window_previews = true
fade_enabled = true
fade_duration_ms = 180

[virtual_workspaces]
mode = "global"
default_workspace_count = 9
workspace_names = [
  "1", "2", "3", "4", "5", "6", "7", "8", "9"
]
workspace_auto_back_and_forth = false
workspace_rules = [
  {workspace = "1", display = ["top", "builtin"]},
  {workspace = "2", display = ["builtin"]},
  {workspace = "3", display = ["top", "builtin"]},
  {workspace = "4", display = ["top", "builtin"]},
  {workspace = "5", display = ["top", "builtin"]},
  {workspace = "6", display = ["top", "builtin"]},
  {workspace = "7", display = ["top", "builtin"]},
  {workspace = "8", display = ["top", "builtin"]},
  {workspace = "9", display = ["top", "builtin"]},
]
app_rules = [
  { app_id = "com.apple.Calculator", floating = true },
  { app_id = "com.apple.systempreferences", floating = true },
  { app_id = "app.zen-browser.zen", workspace = "3" },
  { app_id = "com.tencent.qq", workspace = "9" },
  { app_id = "com.tencent.xinWeChat", workspace = "9" },
]
