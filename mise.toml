[dotfiles."yazi/plugins"]
source = "yazi/shared/plugins"
mode = "symlink-each"
variants = [
    { os = "macos", target = "~/.config/yazi/plugins" },
    { os = "windows", target = "~/AppData/Roaming/yazi/config/plugins" },
]

[dotfiles."yazi/theme.toml"]
source = "yazi/shared/theme.toml"
mode = "symlink"
variants = [
    { os = "macos", target = "~/.config/yazi/theme.toml" },
    { os = "windows", target = "~/AppData/Roaming/yazi/config/theme.toml" },
]
